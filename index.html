<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="todo-app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <p id="taskCounter" class="task-counter">0 tasks remaining</p>
    </header>

    <form id="todoForm" class="input-group" autocomplete="off">
      <input
        type="text"
        id="taskInput"
        placeholder="Add a new task..."
        aria-label="New task"
        required
      />
      <button type="submit" id="addBtn">Add</button>
    </form>

    <ul id="taskList" class="task-list" aria-live="polite"></ul>

    <footer class="app-footer">
      <button type="button" id="clearCompletedBtn" class="clear-btn">
        Clear Completed
      </button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
